name = "Platoon Leader Redux Redux"
author = "snakebyte"
prefix = "PlatoonLeaderReduxRedux"
mainprefix = "z"

[version]
path = "addons/Komodo_High_Command/script_version.hpp" 

[hemtt.build]
pdrive = "require"

[hemtt.check]
pdrive = "require"

# Launched with `hemtt launch`
[hemtt.launch.default]
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "623475643",  # 3den enhanced
    "1779063631", # Zeus enhanced
]

mission = "testPLRR.VR" # Mission to launch directly into the editor with
parameters = [
    "-skipIntro",           # These parameters are passed to the Arma 3 executable
    "-noSplash",            # They do not need to be added to your list
    "-showScriptErrors",    # You can add additional parameters here
    "-debug",
    "-filePatching",
    "-noPause",
]

# Launched with `hemtt launch ace`
[hemtt.launch.ace]
extends = "default"
workshop = [
    "463939057", # ACE3's Workshop ID
]
